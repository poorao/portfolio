<svg viewBox="0 0 110 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="ph-mascot-illustration" aria-label="Graduate hedgehog with PhD mortarboard cap and diploma scroll">
  <!-- Spines -->
  <path d="M20 80C10 74 5 60 6 44C7 26 22 14 42 12C52 11 62 15 70 22L76 18L76 26L82 27L80 35L86 39L82 46L88 53L81 58L85 65L76 69L78 77C68 84 55 88 44 88C32 88 25 84 20 80Z" fill="#b17816" stroke="#23251d" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Body/Face -->
  <path d="M28 82C40 86 58 84 68 72C76 62 76 48 68 40C60 32 46 34 36 42C26 52 22 72 28 82Z" fill="#faefe0" stroke="#23251d" stroke-width="2.5"/>
  <!-- Snout -->
  <path d="M72 44C74 44 76 42 75 40C74 38 72 38 70 40C69 41 70 44 72 44Z" fill="#23251d"/>
  <!-- Eye -->
  <circle cx="60" cy="38" r="2.8" fill="#23251d"/>
  <circle cx="59" cy="37" r="0.8" fill="#ffffff"/>
  <!-- Smile -->
  <path d="M62 48C65 50 68 49 70 47" stroke="#23251d" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="57" cy="46" rx="3" ry="1.8" fill="#f7d6d3"/>
  <!-- Ear -->
  <path d="M44 32C42 28 46 25 50 27C52 28 52 32 49 34" fill="#f7d6d3" stroke="#23251d" stroke-width="2"/>

  <!-- Graduation Cap (Mortarboard) -->
  <!-- Skull cap -->
  <path d="M46 22C46 22 48 16 58 16C68 16 70 22 70 22" fill="#23251d"/>
  <!-- Diamond Top -->
  <polygon points="58,6 84,15 58,24 32,15" fill="#23251d" stroke="#23251d" stroke-width="2" stroke-linejoin="round"/>
  <!-- Cap button -->
  <circle cx="58" cy="15" r="2" fill="#f7a501"/>
  <!-- Tassel hanging down -->
  <path d="M58 15L74 24L76 34" stroke="#f7a501" stroke-width="2" stroke-linecap="round"/>
  <!-- Tassel fringe -->
  <ellipse cx="76" cy="36" rx="2" ry="3.5" fill="#f7a501"/>

  <!-- Diploma Scroll -->
  <rect x="52" y="58" width="30" height="12" rx="2" fill="#ffffff" stroke="#23251d" stroke-width="2" transform="rotate(-15 52 58)"/>
  <rect x="63" y="54" width="6" height="13" fill="#cd4239" stroke="#23251d" stroke-width="1.2" transform="rotate(-15 63 54)"/>
  <!-- Scroll ribbon ends -->
  <path d="M63 67L60 74L64 72L67 76L65 68" fill="#cd4239" stroke="#23251d" stroke-width="1"/>

  <!-- Paws holding diploma -->
  <ellipse cx="54" cy="62" rx="3.5" ry="3" fill="#faefe0" stroke="#23251d" stroke-width="1.8"/>
  <ellipse cx="72" cy="58" rx="3.5" ry="3" fill="#faefe0" stroke="#23251d" stroke-width="1.8"/>

  <!-- Feet -->
  <ellipse cx="32" cy="86" rx="5" ry="3" fill="#faefe0" stroke="#23251d" stroke-width="2"/>
  <ellipse cx="54" cy="86" rx="5" ry="3" fill="#faefe0" stroke="#23251d" stroke-width="2"/>
</svg>
