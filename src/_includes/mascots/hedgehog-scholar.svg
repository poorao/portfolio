  <circle cx="78" cy="62" r="9" fill="#dceaf6" fill-opacity="0.8" stroke="#23251d" stroke-width="2.2"/>
  <circle cx="76" cy="60" r="7" fill="none" stroke="#2c84e0" stroke-width="1" stroke-dasharray="2 2"/>
