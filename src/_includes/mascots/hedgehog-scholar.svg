  <path d="M64 52L72 60L64 60Z" fill="#e5e7e0" stroke="#23251d" stroke-width="1.5"/>
  <!-- Paper text lines -->
  <line x1="47" y1="58" x2="60" y2="58" stroke="#f7a501" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="47" y1="64" x2="68" y2="64" stroke="#9b9c92" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="47" y1="69" x2="66" y2="69" stroke="#9b9c92" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="47" y1="74" x2="68" y2="74" stroke="#9b9c92" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="47" y1="79" x2="58" y2="79" stroke="#9b9c92" stroke-width="1.6" stroke-linecap="round"/>
