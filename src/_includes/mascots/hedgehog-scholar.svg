<svg viewBox="0 0 110 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="ph-mascot-illustration" aria-label="Scholar hedgehog reading research publications">
  <!-- Spines -->
  <path d="M20 78C10 72 5 58 6 42C7 22 24 10 45 8C56 7 66 11 75 18L82 14L82 22L90 23L88 32L96 36L91 44L98 52L90 58L95 66L85 71L87 79C77 86 63 89 48 89C36 89 27 84 20 78Z" fill="#b17816" stroke="#23251d" stroke-width="2.5" stroke-linejoin="round"/>
