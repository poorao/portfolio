  <ellipse cx="85" cy="70" rx="3.5" ry="3" fill="#faefe0" stroke="#23251d" stroke-width="1.8"/>
  <!-- Feet -->
  <ellipse cx="36" cy="86" rx="5" ry="3" fill="#faefe0" stroke="#23251d" stroke-width="2"/>
  <ellipse cx="58" cy="86" rx="5" ry="3" fill="#faefe0" stroke="#23251d" stroke-width="2"/>
</svg>
