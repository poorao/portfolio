<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="760" height="340" rx="16" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="380" y="38" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="-0.01em">
    InterviewApp: Supporting Autonomy in Video Interview Training
  </text>
  <text x="380" y="58" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#94a3b8">
    Grounding training platform design in Self-Determination Theory (SDT)
  </text>

  <!-- Step 1: Practice & Recording -->
  <g transform="translate(35, 85)" filter="url(#shadow)">
    <rect width="200" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="14" y="16" width="36" height="36" rx="8" fill="url(#accent1)" opacity="0.15"/>
    <circle cx="32" cy="34" r="8" fill="#38bdf8"/>
    <text x="60" y="32" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">1. Practice &amp; Record</text>
    <text x="60" y="46" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#38bdf8" font-weight="600">Asynchronous Video</text>

    <text x="16" y="78" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">• Realistic mock interview trials</text>
    <text x="16" y="98" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">• On-demand repeat attempts</text>
    <text x="16" y="118" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">• Safe environment to fail &amp; learn</text>

    <rect x="16" y="132" width="168" height="2" rx="1" fill="#38bdf8" opacity="0.5"/>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 245 160 L 275 160" stroke="#64748b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <polygon points="275,160 267,155 267,165" fill="#64748b"/>

  <!-- Step 2: Self-Reflection & Playback -->
  <g transform="translate(280, 85)" filter="url(#shadow)">
    <rect width="200" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="14" y="16" width="36" height="36" rx="8" fill="url(#accent2)" opacity="0.15"/>
    <polygon points="28,26 40,34 28,42" fill="#34d399"/>
    <text x="60" y="32" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">2. Review &amp; Reflect</text>
    <text x="60" y="46" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#34d399" font-weight="600">Video Playback</text>

    <text x="16" y="78" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">• Objective self-observation</text>
    <text x="16" y="98" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">• Non-evaluative self-audit</text>
    <text x="16" y="118" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">• Autonomous pace &amp; review</text>

    <rect x="16" y="132" width="168" height="2" rx="1" fill="#34d399" opacity="0.5"/>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 490 160 L 520 160" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <polygon points="520,160 512,155 512,165" fill="#64748b"/>

  <!-- Step 3: Actionable Feedback -->
  <g transform="translate(525, 85)" filter="url(#shadow)">
    <rect width="200" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="14" y="16" width="36" height="36" rx="8" fill="url(#accent3)" opacity="0.15"/>
    <path d="M 26 34 L 31 39 L 39 29" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="32" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">3. Actionable Feedback</text>
    <text x="60" y="46" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#fbbf24" font-weight="600">Autonomy-Supportive</text>

    <text x="16" y="78" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">• Constructive guidance</text>
    <text x="16" y="98" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">• Non-coercive suggestions</text>
    <text x="16" y="118" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#cbd5e1" font-weight="500">• Goal-oriented feedback</text>

    <rect x="16" y="132" width="168" height="2" rx="1" fill="#fbbf24" opacity="0.5"/>
  </g>

  <!-- Bottom Outcomes Banner -->
  <g transform="translate(35, 255)">
    <rect width="690" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="35" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.05em">CORE PSYCHOLOGICAL OUTCOMES:</text>
    
    <g transform="translate(240, 16)">
      <rect width="130" height="28" rx="6" fill="#38bdf8" opacity="0.15"/>
      <text x="65" y="18" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">↑ Perceived Autonomy</text>
    </g>
    <g transform="translate(385, 16)">
      <rect width="130" height="28" rx="6" fill="#34d399" opacity="0.15"/>
      <text x="65" y="18" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399">↑ Intrinsic Motivation</text>
    </g>
    <g transform="translate(530, 16)">
      <rect width="140" height="28" rx="6" fill="#fbbf24" opacity="0.15"/>
      <text x="70" y="18" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">↓ Anxiety &amp; Pressure</text>
    </g>
  </g>
</svg>