<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" height="auto">
  <defs>
    <linearGradient id="resumeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="pGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="pGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="760" height="320" rx="16" fill="url(#resumeBg)"/>

  <text x="380" y="38" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="-0.01em">
    ResumeGenAI: LLM-Driven Conversational Feedback Workflow
  </text>
  <text x="380" y="58" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#94a3b8">
    Empowering candidates with iterative, structured, and actionable resume coaching
  </text>

  <!-- Step 1: Input -->
  <g transform="translate(40, 85)" filter="url(#cShadow)">
    <rect width="195" height="145" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="14" y="14" width="34" height="34" rx="8" fill="url(#pGrad1)" opacity="0.2"/>
    <text x="31" y="36" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="16">📄</text>
    <text x="56" y="28" font-family="'Inter', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">Candidate Input</text>
    <text x="56" y="42" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#38bdf8" font-weight="600">Resume &amp; Target Role</text>

    <text x="14" y="72" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#cbd5e1">• PDF/Text resume ingestion</text>
    <text x="14" y="92" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Target job description match</text>
    <text x="14" y="112" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Candidate career goals</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 245 155 L 275 155" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <polygon points="275,155 267,150 267,160" fill="#64748b"/>

  <!-- Step 2: Conversational LLM Engine -->
  <g transform="translate(285, 85)" filter="url(#cShadow)">
    <rect width="195" height="145" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="14" y="14" width="34" height="34" rx="8" fill="url(#pGrad2)" opacity="0.2"/>
    <text x="31" y="36" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="16">🤖</text>
    <text x="56" y="28" font-family="'Inter', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">Conversational AI</text>
    <text x="56" y="42" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#c084fc" font-weight="600">Iterative Coaching</text>

    <text x="14" y="72" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Context-aware critiquing</text>
    <text x="14" y="92" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#cbd5e1">• STAR method framing</text>
    <text x="14" y="112" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Impact-oriented rewriting</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 490 155 L 520 155" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <polygon points="520,155 512,150 512,160" fill="#64748b"/>

  <!-- Step 3: Actionable Output -->
  <g transform="translate(530, 85)" filter="url(#cShadow)">
    <rect width="195" height="145" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="14" y="14" width="34" height="34" rx="8" fill="url(#pGrad3)" opacity="0.2"/>
    <text x="31" y="36" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="16">✨</text>
    <text x="56" y="28" font-family="'Inter', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">Structured Feedback</text>
    <text x="56" y="42" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#34d399" font-weight="600">Empowered Candidate</text>

    <text x="14" y="72" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Specific line-by-line tips</text>
    <text x="14" y="92" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Action verbs &amp; metrics</text>
    <text x="14" y="112" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#cbd5e1">• High candidate agency</text>
  </g>

  <!-- Bottom Interactive Loop -->
  <g transform="translate(40, 245)">
    <rect width="685" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="342" y="32" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="11.5" fill="#94a3b8">
      🔄 Multi-turn dialog allows job seekers to ask questions, challenge recommendations, and refine their own authentic voice.
    </text>
  </g>
</svg>