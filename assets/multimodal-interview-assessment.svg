<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" height="auto">
  <defs>
    <linearGradient id="mmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="audGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="visGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="fuseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="mShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="760" height="330" rx="16" fill="url(#mmBg)"/>

  <text x="380" y="38" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="-0.01em">
    Multimodal Communication Assessment Architecture
  </text>
  <text x="380" y="58" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#94a3b8">
    Acoustic &amp; Visual Behavioral Feature Extraction in Asynchronous vs. Face-to-Face Interviews
  </text>

  <!-- Left: Modalities -->
  <!-- Audio Modality -->
  <g transform="translate(35, 85)" filter="url(#mShadow)">
    <rect width="210" height="98" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="12" y="12" width="30" height="30" rx="6" fill="url(#audGrad)" opacity="0.2"/>
    <text x="27" y="32" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="15">🎙️</text>
    <text x="50" y="26" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Acoustic Stream</text>
    <text x="50" y="38" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#fbbf24" font-weight="600">Prosody &amp; Fluency</text>

    <text x="14" y="62" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Pitch (F0), Intensity, Energy</text>
    <text x="14" y="78" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Speech rate, Pause frequency &amp; filler words</text>
  </g>

  <!-- Visual Modality -->
  <g transform="translate(35, 195)" filter="url(#mShadow)">
    <rect width="210" height="98" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="12" y="12" width="30" height="30" rx="6" fill="url(#visGrad)" opacity="0.2"/>
    <text x="27" y="32" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="15">📹</text>
    <text x="50" y="26" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Visual Stream</text>
    <text x="50" y="38" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#22d3ee" font-weight="600">Non-Verbal Dynamics</text>

    <text x="14" y="62" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Facial action units &amp; smiles</text>
    <text x="14" y="78" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Head pose, Nodding, Eye contact / gaze</text>
  </g>

  <!-- Connector Lines to Fusion -->
  <path d="M 245 134 C 280 134, 280 180, 310 180" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 245 244 C 280 244, 280 200, 310 200" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="310,190 302,185 302,195" fill="#64748b"/>

  <!-- Center: Fusion & Modeling -->
  <g transform="translate(315, 115)" filter="url(#mShadow)">
    <rect width="180" height="150" rx="12" fill="#1e293b" stroke="#6d28d9" stroke-width="1.5"/>
    <rect x="14" y="14" width="32" height="32" rx="8" fill="url(#fuseGrad)" opacity="0.25"/>
    <text x="30" y="35" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="15">⚙️</text>
    <text x="54" y="27" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Feature Fusion</text>
    <text x="54" y="40" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#c084fc" font-weight="600">Machine Learning</text>

    <text x="14" y="72" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Early &amp; late fusion</text>
    <text x="14" y="92" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Support Vector Regression</text>
    <text x="14" y="112" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Cross-setting comparison</text>
    <text x="14" y="132" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#a855f7" font-weight="600">AVI vs. Face-to-Face</text>
  </g>

  <!-- Connector Line to Output -->
  <path d="M 495 190 L 525 190" stroke="#64748b" stroke-width="2"/>
  <polygon points="525,190 517,185 517,195" fill="#64748b"/>

  <!-- Right: Skill Prediction & Outcomes -->
  <g transform="translate(530, 100)" filter="url(#mShadow)">
    <rect width="195" height="180" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="28" font-family="'Inter', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#34d399">🎯 Automated Scoring</text>
    <text x="16" y="44" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#94a3b8">Construct Validation</text>

    <g transform="translate(14, 58)">
      <rect width="167" height="24" rx="4" fill="#0f172a"/>
      <text x="10" y="16" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#f1f5f9">Overall Communication</text>
    </g>
    <g transform="translate(14, 88)">
      <rect width="167" height="24" rx="4" fill="#0f172a"/>
      <text x="10" y="16" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#f1f5f9">Speaking Fluency &amp; Clarity</text>
    </g>
    <g transform="translate(14, 118)">
      <rect width="167" height="24" rx="4" fill="#0f172a"/>
      <text x="10" y="16" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#f1f5f9">Engagement &amp; Expressiveness</text>
    </g>
    <g transform="translate(14, 148)">
      <rect width="167" height="24" rx="4" fill="#0f172a"/>
      <text x="10" y="16" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#f1f5f9">Perceived Hirability</text>
    </g>
  </g>
</svg>